services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: music_library
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ./init-db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    networks:
      - music_network  # Aggiungi questa linea per la rete

  server:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DEBUG=1
      - DB_NAME=music_library
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
    networks:
      - music_network  # Aggiungi questa linea per la rete

volumes:
  postgres_data:

networks:
  music_network:  # Definisci una rete personalizzata
    driver: bridge
