<p>player</p>
<div class="song-control-menu" *ngIf="!isPaused">
  <div class="song-cover-container">
    <img class="song-cover" [src]="trackCover" alt="Copertina" />
    <div class="song-title">{{ trackTitle }}</div>
  </div>
  <div class="controls-container">
    <div class="controls-top-row">
      <button class="control-button" (click)="togglePlayPause()">
        <img [src]="isPaused ? 'assets/icone/play.png' : 'assets/icone/pause.png'" />
      </button>
      <span>{{ currentTime }}</span>
      <!-- Puoi aggiungere qui next/prev -->
    </div>
  </div>
  <!-- <input
    type="range"
    id="progress-bar"
    [value]="progress"
    (input)="onProgressChange($event.target.value)"
  /> -->
</div>
