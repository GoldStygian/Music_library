<!-- artists-page.html -->
<div class="item-grid">
    <!-- Cicla su ciascun artista restituito dal backend -->
    <div class="item-container" *ngFor="let artist of artists">
      <!-- 
        Immagazzino nell’URL il “slug” se presente, altrimenti l’ID 
        (modifica la rotta di destinazione a seconda di come hai configurato il routing 
        per la pagina dettaglio artista, ad esempio: /artisti/:slug o /artisti/:id) 
      -->
      <a [routerLink]="['/artisti', artist.slug ?? artist.id]">
        <!-- 
          Per l’immagine, presuppongo che tu abbia una cartella media organizzata così:
          media/<nome_artista>/cover.jpg 
          Adatta il path se la struttura è diversa. 
        -->
        <img 
          class="item-img" 
          [src]="restService.media_url + '/' + artist.name + '/cover.jpg'" 
          [alt]="artist.name" 
        />
      </a>
  
      <!-- Mostra il nome dell’artista -->
      <p class="item-name">{{ artist.name }}</p>
  
      <!-- (Opzionale) Mostra il paese o description se vuoi -->
      <!-- <p class="item-country" *ngIf="artist.country">{{ artist.country }}</p>
      <p class="item-description" *ngIf="artist.description">{{ artist.description }}</p> -->
    </div>
  
    <!-- Messaggio quando non ci sono artisti -->
    <p *ngIf="artists.length === 0" class="empty-message">
      Nessun artista trovato.
    </p>
  </div>
